name: Deploy naar timonkool.nl

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout e-learning repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Installeer dependencies
        run: npm ci

      - name: Bouw de e-learning
        run: npm run build

      - name: Kopieer naar website-repo
        run: |
          git clone https://x-access-token:${{ secrets.WEBSITE_DEPLOY_TOKEN }}@github.com/timonkool/timonkool.github.io.git website
          rm -rf website/elearning-ai-voor-beginners
          mkdir -p website/elearning-ai-voor-beginners
          cp -r dist/. website/elearning-ai-voor-beginners/
          cd website
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add elearning-ai-voor-beginners/
          git diff --staged --quiet || git commit -m "Update e-learning (automatisch)"
          git push
